<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DocuSmart Pro – E-Mail bestätigt</title><style>:root{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#17324d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}.card{width:min(560px,100%);background:#fff;border:1px solid #d1dfeb;border-radius:20px;padding:34px;box-shadow:0 14px 45px rgba(9,47,87,.12);text-align:center}.brand{font-size:30px;font-weight:800;color:#092f57}.brand span{color:#087fe3}.icon{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;margin:26px auto 18px;background:#e8f7ef;color:#16844b;font-size:42px;font-weight:800}h1{font-size:25px;margin:0 0 12px}p{line-height:1.55;color:#526f88}.note{margin-top:24px;padding:14px;border-radius:12px;background:#edf5fc}.error .icon{background:#fff0f0;color:#b42318}.error h1{color:#b42318}.small{font-size:12px;margin-top:26px}</style></head><body><main class="card" id="card"><div class="brand">DocuSmart <span>Pro</span></div><div class="icon" id="icon">✓</div><h1 id="title">E-Mail erfolgreich bestätigt</h1><p id="text">Dein DocuSmart-Konto ist jetzt aktiviert.</p><div class="note" id="note">Du kannst diese Seite schließen, zur DocuSmart-App zurückkehren und dich mit deiner E-Mail-Adresse und deinem Passwort anmelden.</div><p class="small">DocuSmart Pro · Dokumente. Intelligent. Organisiert.</p></main><script>const q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.replace(/^#/,''));const err=q.get('error_description')||h.get('error_description')||q.get('error')||h.get('error');if(err){card.classList.add('error');icon.textContent='!';title.textContent='Bestätigung nicht möglich';text.textContent=decodeURIComponent(String(err).replace(/\+/g,' '));note.textContent='Bitte fordere bei Bedarf einen neuen Link an oder versuche es erneut.'}</script></body></html>
