name: DieselRoute Web Import and Worker Tests
on:
  push:
    branches: [main]
    paths:
      - 'docs/dieselroute/**'
      - 'dieselroute-price-worker/**'
      - '.github/workflows/dieselroute-web-tests.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend JavaScript, manifest, Worker and Maps parser
        shell: bash
        run: |
          python3 - <<'PY'
          import json,pathlib
          html=pathlib.Path('docs/dieselroute/index.html').read_text()
          assert html.count('<script>')==1, 'Expected one inline JavaScript block'
          code=html.split('<script>',1)[1].split('</script>',1)[0]
          pathlib.Path('/tmp/dieselroute-web.js').write_text(code)
          json.loads(pathlib.Path('docs/dieselroute/manifest.webmanifest').read_text())
          print('Manifest parsed, inline script extracted')
          PY
          cp dieselroute-price-worker/src/index.js /tmp/dieselroute-worker.mjs
          node --check /tmp/dieselroute-web.js
          node --check /tmp/dieselroute-worker.mjs
          node --check docs/dieselroute/sw.js
          node - <<'JS'
          const fs=require('fs'),vm=require('vm'),assert=require('assert/strict');
          const s=fs.readFileSync('/tmp/dieselroute-web.js','utf8');
          const block=s.slice(s.indexOf('function extractUrlFromText('),s.indexOf('async function importSharedLink()'));
          const ctx={URL,URLSearchParams,decodeURIComponent,Error};
          vm.runInNewContext(block,ctx);
          let a=ctx.parseMapsDirections('https://www.google.com/maps/dir/?api=1&origin=Berlin%2CGermany&destination=Hamburg%2CGermany&waypoints=Hannover%7CBremen');
          assert.equal(a.end,'Hamburg,Germany');
          assert.equal(a.via,'Hannover | Bremen');
          a=ctx.parseMapsDirections('https://www.google.com/maps/dir/Berlin/Hannover/Hamburg/');
          assert.equal(a.end,'Hamburg');
          assert.equal(a.start,'Berlin');
          assert.equal(a.via,'Hannover');
          a=ctx.parseMapsDirections('https://www.google.com/maps/dir/?api=1&destination=Verden');
          assert.equal(a.end,'Verden');
          assert.equal(ctx.streetOnlyDestination('Hauptstraße 12'),true);
          assert.equal(ctx.streetOnlyDestination('Westerstraße'),true);
          assert.equal(ctx.streetOnlyDestination('Hauptstraße 12, 27283 Verden'),false);
          assert.equal(ctx.streetOnlyDestination('52.52,13.405'),false);
          assert.equal(ctx.matchesResolvedDestination('Hauptstraße 12, 27283 Verden',
            {display_name:'Hauptstraße 12, Verden, 27283, Niedersachsen',address:{postcode:'27283'}}),true);
          assert.equal(ctx.matchesResolvedDestination('Hauptstraße 12, 27283 Verden',
            {display_name:'Hauptstraße 12, Bremen, 28195',address:{postcode:'28195'}}),false);
          assert.equal(ctx.matchesResolvedDestination('Hauptstraße 12, Verden',
            {display_name:'Hauptstraße 12, Bremen, Deutschland',address:{}}),false);
          assert.equal(ctx.matchesResolvedDestination('Hauptstraße 12, Verden, Niedersachsen',
            {display_name:'Hauptstraße 12, Oldenburg, Niedersachsen',address:{}}),false);
          assert.equal(ctx.canonicalDestination('Ringstraße 15, D-56459 Berzhahn, Deutschland'),
            'Ringstraße 15, 56459 Berzhahn, Deutschland');
          assert.equal(ctx.streetOnlyDestination('Ringstraße 15, D-56459 Berzhahn, Deutschland'),false);
          assert.equal(ctx.matchesResolvedDestination('Ringstraße 15, D-56459 Berzhahn, Deutschland',
            {display_name:'Ringstraße, Berzhahn, Westerwaldkreis, Rheinland-Pfalz, 56459, Deutschland',
             address:{postcode:'56459',road:'Ringstraße',village:'Berzhahn'}}),true);
          assert.equal(ctx.matchesResolvedDestination('Ringstraße 15, D-56459 Berzhahn, Deutschland',
            {display_name:'Ringstraße, Montabaur, Westerwaldkreis, Rheinland-Pfalz, 56410, Deutschland',
             address:{postcode:'56410',road:'Ringstraße',town:'Montabaur'}}),false);
          assert.equal(ctx.extractUrlFromText('Route teilen: https://maps.app.goo.gl/abc123'),'https://maps.app.goo.gl/abc123');
          console.log('Parser test PASSED');
          JS
      - name: Verify published DieselRoute share target files
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json
          base='https://docusmart-releases.github.io/docusmart-releases/dieselroute/'
          for path in ['?v=0.10.2','manifest.webmanifest','sw.js','icon.svg']:
              req=urllib.request.Request(base+path,headers={'User-Agent':'Mozilla/5.0 DieselRoute-webtest'})
              with urllib.request.urlopen(req,timeout=18) as res:
                  assert res.status==200
                  data=res.read(150000).decode('utf-8')
                  print('Page asset:',path,'HTTP',res.status,'bytes',len(data))
                  if path=='?v=0.9': assert 'Testversion 0.10.2' in data and 'acceptSharedGoogleMapsLink' in data
                  if path=='manifest.webmanifest':
                      m=json.loads(data)
                      assert m['share_target']['params']['url']=='url'
                      assert m['scope']=='./'
          PY
      - name: Verify live Worker routes (read-only)
        shell: bash
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse
          base='https://dieselroute-price-worker.patrick-jung-0ba.workers.dev'
          def call(path):
              req=urllib.request.Request(base+path,headers={'Origin':'https://docusmart-releases.github.io','Accept':'application/json','User-Agent':'DieselRoute-smoketest'})
              with urllib.request.urlopen(req,timeout=18) as r:
                  assert r.status==200
                  assert r.headers.get('Access-Control-Allow-Origin')=='https://docusmart-releases.github.io'
                  return json.load(r)
          print('Health:',call('/health')['ok'])
          target='https://www.google.com/maps/dir/?api=1&destination=Berlin'
          result=call('/api/maps/resolve?url='+urllib.parse.quote(target,safe=''))
          assert result['url'].startswith('https://www.google.com/maps/dir/')
          print('Maps endpoint OK')
          # Publicly posted Google Maps shortlink; only log status/host, never the route or coordinates.
          short='https://maps.app.goo.gl/nQYgTaAfqsCMreWc8'
          try:
              expanded=call('/api/maps/resolve?url='+urllib.parse.quote(short,safe=''))
              parsed=urllib.parse.urlparse(expanded['url'])
              print('Public Maps shortlink: host',parsed.hostname,'route_path',('/dir/' in parsed.path),'place_path',('/place/' in parsed.path),'query_keys',sorted(urllib.parse.parse_qs(parsed.query).keys()))
          except Exception as exc:
              print('Public Maps shortlink: unresolved',type(exc).__name__,str(exc)[:90])

          PY
